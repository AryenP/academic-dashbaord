name: Check

# Full test suite on every push and pull request: lint, format, unit, build and browser tests, then the
# database, function and signed-in browser tests against a local Supabase.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npm run test:fn
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor,storage-api,mailpit,edge-runtime
      - run: npm run test:db
      - name: Serve the Edge Functions
        run: |
          echo 'SYNC_KEY=ci-sync-key' > supabase/functions/.env
          supabase functions serve --no-verify-jwt --env-file supabase/functions/.env > functions.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null -X OPTIONS http://127.0.0.1:54321/functions/v1/phone-event && break
            sleep 2
          done
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.db.config.ts sessions phone spotify offline connect a11y
      - if: failure()
        run: cat functions.log
