name: Deploy

# Builds the site and publishes dist/ to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Runs on every push to main, and is called by the calendar sync after it commits a new plan,
# because pushes made with the workflow's own token don't trigger other workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # when called from the sync, build the commit it just pushed, not the one it started from
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          # 'true' once the Google provider is enabled in Supabase (repo variable, not a secret).
          VITE_GOOGLE_SIGNIN: ${{ vars.GOOGLE_SIGNIN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The site that went live answers with the landing page and the privacy page. A failure here
  # fails the run, so a broken deploy reaches a person instead of a student.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          base="${URL:-https://aryenp.github.io/academic-dashbaord/}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$base" | grep -q 'Your runway to every exam.' && curl -fsS -o /dev/null "${base}privacy.html"; then
              echo "live: $base"; exit 0
            fi
            echo "not yet ($i), waiting for the CDN"; sleep 20
          done
          echo "::error::$base did not serve the landing page after a deploy. See docs/RUNBOOK.md."
          exit 1
