name: Keep Supabase awake

# Supabase pauses free projects after 7 days without API requests. One public, empty read a day keeps
# the project up. It calls share_profile for a handle nobody has, so it returns nothing.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -m 20 -o /dev/null -w "Supabase answered %{http_code}\n" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/share_profile" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{"p_handle":"keepalive"}'
