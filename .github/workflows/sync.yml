name: Sync calendar

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Rebuild data.json from Google Calendar
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
        run: python scripts/sync.py

      - name: Commit if the plan changed
        run: |
          if git diff --quiet -- data.json; then
            echo "Plan unchanged."
            exit 0
          fi
          git config user.name "calendar-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Sync plan from Google Calendar"
          git push
