name: Sync calendar

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Rebuild public/data.json from Google Calendar
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
        run: python scripts/sync.py

      - name: Commit if the plan changed
        id: commit
        run: |
          if git diff --quiet -- public/data.json; then
            echo "Plan unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "calendar-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git commit -m "Sync plan from Google Calendar"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN doesn't start the Deploy workflow, so call it directly.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
