<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Connecting Spotify · Runway</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          16px ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        background: #fff;
        color: #1b1d22;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #15171c;
          color: #eceef2;
        }
      }
    </style>
  </head>
  <body>
    <p>Connecting Spotify…</p>
    <script>
      // Spotify redirects here after sign-in. Hand the result to the app and go back to Settings,
      // where it finishes the PKCE exchange. This keeps Spotify's ?code= away from the site root,
      // which Supabase sign-in uses.
      try {
        localStorage.setItem('runway.spotify.callback', location.search.slice(1));
      } catch (e) {}
      location.replace('./#/settings?spotify=1');
    </script>
  </body>
</html>
